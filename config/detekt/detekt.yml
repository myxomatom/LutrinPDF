# Overrides on top of the detekt default configuration (buildUponDefaultConfig = true).

comments:
  # Public and internal API must be documented (AGENTS.md §6).
  UndocumentedPublicClass:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
  UndocumentedPublicFunction:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']
  UndocumentedPublicProperty:
    active: true
    excludes: ['**/test/**', '**/androidTest/**']

complexity:
  LongMethod:
    # AGENTS.md §4: short functions (about 30 lines).
    threshold: 40
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

style:
  MagicNumber:
    # Theme tokens and similar constants are named properties, which is what the rule asks for.
    ignorePropertyDeclaration: true
    excludes: ['**/test/**', '**/androidTest/**']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
