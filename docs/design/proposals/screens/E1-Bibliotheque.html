<!doctype html>
<!-- SPDX-License-Identifier: GPL-3.0-or-later -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lutrin — Proposition · Bibliothèque</title>
<link rel="stylesheet" href="../proposal.css">
<style>
.hero{margin:4px 16px 12px;padding:16px;border-radius:28px;background:var(--primary-container);color:var(--on-primary-container);display:flex;gap:16px;align-items:stretch;border:0;text-align:left;font-family:inherit}
.hero .pg{width:104px;height:138px;padding:16px 13px;border-color:#B4C8E6;box-shadow:0 6px 16px rgba(0,28,56,0.22);transform:rotate(-3deg)}
.hero .pg .l{height:4px;margin-bottom:7px}
.over{font-size:11px;line-height:16px;font-weight:500;letter-spacing:0.8px;text-transform:uppercase;color:var(--primary)}
.cta{height:40px;border-radius:20px;background:var(--primary);color:var(--on-primary);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 20px;align-self:flex-start}
.cta .i{width:18px;height:18px}
</style>
</head>
<body>
<div class="phone">
  <header style="height:72px;display:flex;align-items:center;padding:0 4px 0 16px;gap:4px;flex:none">
    <h1 class="serif" style="flex:1;font-size:32px;line-height:40px">Lutrin</h1>
    <button class="ib" aria-label="Affichage en grille"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1"></rect><rect x="13" y="4" width="7" height="7" rx="1"></rect><rect x="4" y="13" width="7" height="7" rx="1"></rect><rect x="13" y="13" width="7" height="7" rx="1"></rect></svg></button>
    <button class="ib" aria-label="Outils PDF"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.5-.5-2.5z"></path></svg></button>
    <button class="ib" aria-label="Paramètres"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg></button>
  </header>

  <!-- Carte « Reprendre la lecture » : toute la carte est la cible tactile ; la vignette
       est l'élément partagé de la transition vers le lecteur (E2). -->
  <button class="hero" aria-label="Reprendre la lecture de Contrat de location, page 3 sur 8">
    <div class="pg" aria-hidden="true">
      <div class="l h" style="width:62%;height:5px;margin-bottom:10px"></div>
      <div class="l"></div><div class="l" style="width:94%"></div><div class="l"></div><div class="l" style="width:70%"></div>
      <div class="l h" style="width:40%;margin-top:11px"></div>
      <div class="l"></div><div class="l" style="width:90%"></div><div class="l"></div><div class="l" style="width:55%"></div>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column">
      <span class="over">Reprendre la lecture</span>
      <span class="serif" style="font-size:22px;line-height:26px;margin-top:6px">Contrat de location</span>
      <span style="font-size:14px;line-height:20px;margin-top:2px;color:var(--on-primary-container)">Page 3 sur 8 · aujourd’hui, 20:41</span>
      <div style="height:6px;border-radius:3px;background:var(--primary-faint);margin-top:10px;overflow:hidden"><div style="height:100%;width:37%;background:var(--primary);border-radius:3px"></div></div>
      <span style="flex:1"></span>
      <span class="cta">Continuer<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </div>
  </button>

  <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px">
    <h2 style="font-size:14px;font-weight:500;color:var(--primary);letter-spacing:0.1px">Récents</h2>
    <span style="font-size:12px;color:var(--on-surface-variant)">5 autres documents</span>
  </div>

  <div style="flex:1;display:flex;flex-direction:column">
    <!-- Facture : en cours de lecture → barre de progression -->
    <div class="row">
      <div class="pg sm" aria-hidden="true">
        <div class="l h" style="width:45%"></div>
        <div class="l" style="width:55%;margin-left:45%"></div>
        <div style="border-top:1px solid #C3C6CF;border-bottom:1px solid #C3C6CF;padding:4px 0 0;margin:6px 0 5px"><div class="l"></div><div class="l"></div><div class="l" style="margin-bottom:4px"></div></div>
        <div class="l" style="width:40%;margin-left:60%;background:#2A5B8C"></div>
      </div>
      <div class="txt">
        <span class="t">Facture octobre 2026</span>
        <span class="m">Page 1 sur 2 · aujourd’hui, 18:05</span>
        <div class="bar"><div style="width:50%"></div></div>
      </div>
      <button class="ib" aria-label="Options du document"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="12" cy="19" r="1.3" fill="currentColor"></circle></svg></button>
    </div>

    <!-- Relevé : protégé, jamais ouvert → pas de barre vide -->
    <div class="row">
      <div class="pg sm" style="overflow:visible" aria-hidden="true">
        <div class="l h" style="width:70%"></div>
        <div style="display:grid;grid-template-columns:2fr 1fr;column-gap:5px;margin-top:7px"><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div></div>
        <div class="lock"><svg class="i" viewBox="0 0 24 24" role="img" aria-label="Document protégé"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></div>
      </div>
      <div class="txt">
        <span class="t">Relevé de compte</span>
        <span class="m">4 pages · hier</span>
      </div>
      <button class="ib" aria-label="Options du document"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="12" cy="19" r="1.3" fill="currentColor"></circle></svg></button>
    </div>

    <div class="row">
      <div class="pg sm" aria-hidden="true">
        <div style="height:22px;border-radius:2px;background:#DDE6F2;margin-bottom:6px;display:flex;align-items:center;justify-content:center"><div style="width:12px;height:12px;border-radius:6px;border:2px solid #8FA9C8;box-sizing:border-box"></div></div>
        <div class="l h" style="width:60%"></div><div class="l"></div><div class="l" style="width:85%"></div><div class="l" style="width:50%"></div>
      </div>
      <div class="txt">
        <span class="t">Manuel lave-linge</span>
        <span class="m">Page 22 sur 64 · 28 oct.</span>
        <div class="bar"><div style="width:34%"></div></div>
      </div>
      <button class="ib" aria-label="Options du document"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="12" cy="19" r="1.3" fill="currentColor"></circle></svg></button>
    </div>

    <div class="row">
      <div class="pg sm" aria-hidden="true">
        <div class="l h" style="width:70%;margin:12px auto 5px"></div>
        <div class="l h" style="width:45%;margin:0 auto 12px"></div>
        <div class="l" style="width:35%;margin:0 auto 5px"></div>
        <div class="l" style="width:25%;margin:0 auto"></div>
      </div>
      <div class="txt">
        <span class="t">Mémoire — chapitre 2</span>
        <span class="m">Page 87 sur 112 · 25 oct.</span>
        <div class="bar"><div style="width:78%"></div></div>
      </div>
      <button class="ib" aria-label="Options du document"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="12" cy="19" r="1.3" fill="currentColor"></circle></svg></button>
    </div>

    <!-- Billet : une seule page → pas de barre pleine -->
    <div class="row">
      <div class="pg sm" style="padding:0" aria-hidden="true">
        <div style="height:14px;background:#B5473C"></div>
        <div style="padding:7px"><div class="l h" style="width:75%"></div><div class="l" style="width:55%"></div>
          <div style="width:18px;height:18px;margin-top:6px;background:repeating-linear-gradient(90deg,#43474E 0 2px,transparent 2px 4px),repeating-linear-gradient(0deg,#43474E 0 2px,transparent 2px 4px)"></div></div>
      </div>
      <div class="txt">
        <span class="t">Billet de train Lyon–Paris</span>
        <span class="m">1 page · 19 oct.</span>
      </div>
      <button class="ib" aria-label="Options du document"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.3" fill="currentColor"></circle><circle cx="12" cy="12" r="1.3" fill="currentColor"></circle><circle cx="12" cy="19" r="1.3" fill="currentColor"></circle></svg></button>
    </div>
  </div>

  <button style="position:absolute;right:16px;bottom:24px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;gap:12px;font-size:16px;font-weight:500;box-shadow:0 3px 8px rgba(0,0,0,0.18)">
    <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
    Ouvrir un fichier
  </button>
</div>
</body>
</html>
