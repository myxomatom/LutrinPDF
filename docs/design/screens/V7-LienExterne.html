<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lutrin — Confirmation de lien externe</title>
<style>
@font-face{font-family:Roboto;font-weight:400;src:url(../assets/fonts/roboto-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:500;src:url(../assets/fonts/roboto-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:700;src:url(../assets/fonts/roboto-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Roboto Mono";font-weight:400;src:url(../assets/fonts/roboto-mono-latin-400-normal.woff2) format("woff2")}
</style>
<style>
body{margin:0}
a{color:#2A5B8C}a:hover{color:#1C4470}
button{font-family:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
<style>html{background:#DADCE0}body{display:flex;justify-content:center;padding:40px 0}body>div{border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#E6E8ED;color:#191C20;font-family:Roboto,system-ui,sans-serif;overflow:hidden;position:relative">
  <div aria-hidden="true" style="height:64px;background:#F8F9FC"></div>
  <div aria-hidden="true" style="position:absolute;left:24px;top:80px;width:342px;height:484px;background:#FFFFFF"></div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(0,0,0,0.32)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="link-title" style="position:absolute;left:24px;right:24px;top:240px;background:#ECEEF3;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px">
    <svg class="i" viewBox="0 0 24 24" style="color:#2A5B8C;align-self:center" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>
    <h2 id="link-title" style="margin:0;font-size:24px;font-weight:400;line-height:32px;text-align:center">Ouvrir un lien externe ?</h2>
    <div style="padding:12px 16px;border-radius:12px;background:#FFFFFF;border:1px solid #C3C6CF;font-size:14px;line-height:20px;word-break:break-all;color:#191C20">https://exemple.org/conditions-generales</div>
    <p style="margin:0;font-size:14px;line-height:20px;color:#43474E">Lutrin n’accède pas à Internet. Le lien sera ouvert dans l’application de votre choix.</p>
    <div style="display:flex;justify-content:space-between;gap:8px">
      <button style="height:40px;padding:0 12px;border:0;background:transparent;color:#2A5B8C;font-size:14px;font-weight:500;border-radius:20px">Copier</button>
      <span style="display:flex;gap:8px">
        <button style="height:40px;padding:0 12px;border:0;background:transparent;color:#2A5B8C;font-size:14px;font-weight:500;border-radius:20px">Annuler</button>
        <button style="height:40px;padding:0 12px;border:0;background:transparent;color:#2A5B8C;font-size:14px;font-weight:500;border-radius:20px">Ouvrir</button>
      </span>
    </div>
  </div>
</div>
</body>
</html>
