<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lutrin — Table des matières</title>
<style>
@font-face{font-family:Roboto;font-weight:400;src:url(../assets/fonts/roboto-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:500;src:url(../assets/fonts/roboto-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:700;src:url(../assets/fonts/roboto-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Roboto Mono";font-weight:400;src:url(../assets/fonts/roboto-mono-latin-400-normal.woff2) format("woff2")}
</style>
<style>
body{margin:0}
a{color:#2A5B8C}a:hover{color:#1C4470}
button{font-family:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:48px;height:48px;border:0;background:transparent;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#43474E;padding:0}
</style>
<style>html{background:#DADCE0}body{display:flex;justify-content:center;padding:40px 0}body>div{border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#E6E8ED;color:#191C20;font-family:Roboto,system-ui,sans-serif;overflow:hidden;position:relative">
  <div aria-hidden="true" style="height:64px;background:#F8F9FC"></div>
  <div aria-hidden="true" style="position:absolute;left:24px;top:80px;width:342px;height:484px;background:#FFFFFF"></div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(0,0,0,0.32)"></div>

  <nav aria-label="Table des matières" style="position:absolute;left:0;top:0;bottom:0;width:320px;background:#F2F3F8;border-radius:0 16px 16px 0;display:flex;flex-direction:column;padding:12px 12px 16px">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:4px 4px 8px 16px">
      <h2 style="margin:0;font-size:22px;font-weight:400">Table des matières</h2>
      <button class="ib" aria-label="Fermer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    </div>
    <span style="padding:0 16px 12px;font-size:14px;color:#43474E">Contrat de location · 8 pages</span>
    
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 42px;border-radius:24px;text-decoration:none;color:#191C20;background:transparent">
        
        <span style="flex:1;font-size:14px;font-weight:400">1. Objet du contrat</span>
        <span style="font-size:12px;color:#43474E">p. 1</span>
      </a>
    
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 16px;border-radius:24px;text-decoration:none;color:#191C20;background:transparent">
        
          <svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;transform:rotate(90deg)" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        
        <span style="flex:1;font-size:14px;font-weight:400">2. Durée du bail</span>
        <span style="font-size:12px;color:#43474E">p. 2</span>
      </a>
    
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 50px;border-radius:24px;text-decoration:none;color:#191C20;background:transparent">
        
        <span style="flex:1;font-size:14px;font-weight:400">2.1 Date de prise d’effet</span>
        <span style="font-size:12px;color:#43474E">p. 2</span>
      </a>
    
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 50px;border-radius:24px;text-decoration:none;color:#191C20;background:transparent">
        
        <span style="flex:1;font-size:14px;font-weight:400">2.2 Renouvellement</span>
        <span style="font-size:12px;color:#43474E">p. 2</span>
      </a>
    
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 16px;border-radius:24px;text-decoration:none;color:#101C2B;background:#D7E3F7">
        
          <svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;transform:none" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        
        <span style="flex:1;font-size:14px;font-weight:500">3. Loyer et charges</span>
        <span style="font-size:12px;color:#43474E">p. 3</span>
      </a>
    
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 16px;border-radius:24px;text-decoration:none;color:#191C20;background:transparent">
        
          <svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;transform:none" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
        
        <span style="flex:1;font-size:14px;font-weight:400">4. Résiliation</span>
        <span style="font-size:12px;color:#43474E">p. 5</span>
      </a>
    
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 42px;border-radius:24px;text-decoration:none;color:#191C20;background:transparent">
        
        <span style="flex:1;font-size:14px;font-weight:400">5. Dépôt de garantie</span>
        <span style="font-size:12px;color:#43474E">p. 6</span>
      </a>
    
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 42px;border-radius:24px;text-decoration:none;color:#191C20;background:transparent">
        
        <span style="flex:1;font-size:14px;font-weight:400">6. État des lieux</span>
        <span style="font-size:12px;color:#43474E">p. 7</span>
      </a>
    
      <a href="#" style="display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px 0 42px;border-radius:24px;text-decoration:none;color:#191C20;background:transparent">
        
        <span style="flex:1;font-size:14px;font-weight:400">Annexes</span>
        <span style="font-size:12px;color:#43474E">p. 8</span>
      </a>
    
  </nav>
</div>
</body>
</html>
