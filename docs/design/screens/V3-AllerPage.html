<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lutrin — Aller à la page</title>
<style>
@font-face{font-family:Roboto;font-weight:400;src:url(../assets/fonts/roboto-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:500;src:url(../assets/fonts/roboto-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:700;src:url(../assets/fonts/roboto-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Roboto Mono";font-weight:400;src:url(../assets/fonts/roboto-mono-latin-400-normal.woff2) format("woff2")}
</style>
<style>
body{margin:0}
a{color:#2A5B8C}a:hover{color:#1C4470}
button{font-family:inherit;cursor:pointer}
</style>
<style>html{background:#DADCE0}body{display:flex;justify-content:center;padding:40px 0}body>div{border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#E6E8ED;color:#191C20;font-family:Roboto,system-ui,sans-serif;overflow:hidden;position:relative">
  <div aria-hidden="true" style="height:64px;background:#F8F9FC"></div>
  <div aria-hidden="true" style="position:absolute;left:24px;top:80px;width:342px;height:484px;background:#FFFFFF"></div>
  <div aria-hidden="true" style="position:absolute;left:0;right:0;bottom:0;height:76px;background:#F8F9FC"></div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(0,0,0,0.32)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="goto-title" style="position:absolute;left:28px;right:28px;top:290px;background:#ECEEF3;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px">
    <h2 id="goto-title" style="margin:0;font-size:24px;font-weight:400;line-height:32px">Aller à la page</h2>
    <label style="display:flex;flex-direction:column;gap:4px;position:relative">
      <span style="position:absolute;top:-8px;left:12px;padding:0 4px;background:#ECEEF3;font-size:12px;color:#2A5B8C">Numéro de page</span>
      <input type="number" inputmode="numeric" min="1" max="8" value="5" style="height:56px;box-sizing:border-box;padding:0 16px;border:2px solid #2A5B8C;border-radius:4px;background:transparent;font:inherit;font-size:16px;color:#191C20">
      <span style="padding:0 16px;font-size:12px;color:#43474E">Entre 1 et 8</span>
    </label>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button style="height:40px;padding:0 12px;border:0;background:transparent;color:#2A5B8C;font-size:14px;font-weight:500;border-radius:20px">Annuler</button>
      <button style="height:40px;padding:0 12px;border:0;background:transparent;color:#2A5B8C;font-size:14px;font-weight:500;border-radius:20px">Aller</button>
    </div>
  </div>
</div>
</body>
</html>
