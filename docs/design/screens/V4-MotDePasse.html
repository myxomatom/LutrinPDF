<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lutrin — Mot de passe du document</title>
<style>
@font-face{font-family:Roboto;font-weight:400;src:url(../assets/fonts/roboto-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:500;src:url(../assets/fonts/roboto-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:700;src:url(../assets/fonts/roboto-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Roboto Mono";font-weight:400;src:url(../assets/fonts/roboto-mono-latin-400-normal.woff2) format("woff2")}
</style>
<style>
body{margin:0}
a{color:#2A5B8C}a:hover{color:#1C4470}
button{font-family:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
<style>html{background:#DADCE0}body{display:flex;justify-content:center;padding:40px 0}body>div{border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F8F9FC;color:#191C20;font-family:Roboto,system-ui,sans-serif;overflow:hidden;position:relative">
  <div aria-hidden="true" style="padding:20px 16px;font-size:22px;font-weight:500">Lutrin</div>
  <div aria-hidden="true" style="display:flex;flex-direction:column;gap:20px;padding:20px 16px">
    <div style="height:58px;width:44px;background:#FFFFFF;border:1px solid #C3C6CF;border-radius:4px"></div>
    <div style="height:58px;width:44px;background:#FFFFFF;border:1px solid #C3C6CF;border-radius:4px"></div>
    <div style="height:58px;width:44px;background:#FFFFFF;border:1px solid #C3C6CF;border-radius:4px"></div>
  </div>
  <div aria-hidden="true" style="position:absolute;inset:0;background:rgba(0,0,0,0.32)"></div>

  <div role="dialog" aria-modal="true" aria-labelledby="pw-title" style="position:absolute;left:24px;right:24px;top:220px;background:#ECEEF3;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px">
    <svg class="i" viewBox="0 0 24 24" style="color:#2A5B8C;align-self:center" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
    <h2 id="pw-title" style="margin:0;font-size:24px;font-weight:400;line-height:32px;text-align:center">Document protégé</h2>
    <p style="margin:0;font-size:14px;line-height:20px;color:#43474E">« Relevé de compte » est chiffré. Saisissez son mot de passe pour l’ouvrir.</p>
    <label style="display:flex;flex-direction:column;gap:4px;position:relative">
      <span style="position:absolute;top:-8px;left:12px;padding:0 4px;background:#ECEEF3;font-size:12px;color:#BA1A1A">Mot de passe</span>
      <span style="display:flex;align-items:center;height:56px;box-sizing:border-box;border:2px solid #BA1A1A;border-radius:4px;padding:0 4px 0 16px">
        <input type="password" value="motdepasse" autocomplete="off" style="flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:#191C20;outline:none">
        <button aria-label="Afficher le mot de passe" style="width:48px;height:48px;border:0;background:transparent;color:#43474E;display:flex;align-items:center;justify-content:center;border-radius:24px"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
      </span>
      <span style="padding:0 16px;font-size:12px;color:#BA1A1A">Mot de passe incorrect. Réessayez.</span>
    </label>
    <p style="margin:0;font-size:12px;line-height:16px;color:#43474E">Le mot de passe n’est jamais enregistré.</p>
    <div style="display:flex;justify-content:flex-end;gap:8px">
      <button style="height:40px;padding:0 12px;border:0;background:transparent;color:#2A5B8C;font-size:14px;font-weight:500;border-radius:20px">Annuler</button>
      <button style="height:40px;padding:0 12px;border:0;background:transparent;color:#2A5B8C;font-size:14px;font-weight:500;border-radius:20px">Ouvrir</button>
    </div>
  </div>
</div>
</body>
</html>
