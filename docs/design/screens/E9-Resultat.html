<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lutrin — PDF créé</title>
<style>
@font-face{font-family:Roboto;font-weight:400;src:url(../assets/fonts/roboto-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:500;src:url(../assets/fonts/roboto-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:700;src:url(../assets/fonts/roboto-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Roboto Mono";font-weight:400;src:url(../assets/fonts/roboto-mono-latin-400-normal.woff2) format("woff2")}
</style>
<style>
body{margin:0}
a{color:#2A5B8C}a:hover{color:#1C4470}
button{font-family:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tl{height:3px;background:#D9DCE2;border-radius:2px;margin-bottom:5px}
</style>
<style>html{background:#DADCE0}body{display:flex;justify-content:center;padding:40px 0}body>div{border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F8F9FC;color:#191C20;font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <header style="height:64px;display:flex;align-items:center;padding:0 24px;flex:none">
    <h1 style="margin:0;font-size:22px;font-weight:500">Fusion</h1>
  </header>

  <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:20px;padding:0 24px 80px">
    <div style="width:80px;height:80px;border-radius:40px;background:#2A5B8C;color:#FFFFFF;display:flex;align-items:center;justify-content:center;align-self:center">
      <svg class="i" viewBox="0 0 24 24" style="width:40px;height:40px;stroke-width:2.2" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>
    </div>
    <h2 style="margin:0;font-size:24px;font-weight:400;text-align:center">PDF créé</h2>

    <div style="display:flex;gap:16px;align-items:center;padding:16px;border-radius:16px;background:#ECEEF3">
      <div aria-hidden="true" style="width:44px;height:58px;flex:none;background:#FFFFFF;border:1px solid #C3C6CF;border-radius:4px;box-sizing:border-box;padding:9px 7px">
        <div class="tl" style="width:60%;background:#8A8E96"></div><div class="tl"></div><div class="tl"></div><div class="tl" style="width:80%"></div><div class="tl"></div>
      </div>
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">fusion_2026-11-03_2054.pdf</span>
        <span style="font-size:14px;color:#43474E">13 pages · 2,1 Mo</span>
        <span style="font-size:12px;color:#43474E">Documents/Lutrin · ajouté aux récents</span>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <button style="height:48px;border:0;border-radius:24px;background:#2A5B8C;color:#FFFFFF;font-size:14px;font-weight:500">Ouvrir</button>
      <button style="height:48px;border:0;border-radius:24px;background:#D7E3F7;color:#101C2B;font-size:14px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px">
        <svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px" aria-hidden="true"><circle cx="18" cy="5" r="2.5"></circle><circle cx="6" cy="12" r="2.5"></circle><circle cx="18" cy="19" r="2.5"></circle><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"></path></svg>Partager
      </button>
      <button style="height:48px;border:0;border-radius:24px;background:transparent;color:#2A5B8C;font-size:14px;font-weight:500">Terminé</button>
    </div>
  </div>
</div>
</body>
</html>
