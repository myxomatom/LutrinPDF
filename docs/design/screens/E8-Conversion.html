<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lutrin — Convertir en PDF</title>
<style>
@font-face{font-family:Roboto;font-weight:400;src:url(../assets/fonts/roboto-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:500;src:url(../assets/fonts/roboto-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:700;src:url(../assets/fonts/roboto-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Roboto Mono";font-weight:400;src:url(../assets/fonts/roboto-mono-latin-400-normal.woff2) format("woff2")}
</style>
<style>
body{margin:0}
a{color:#2A5B8C}a:hover{color:#1C4470}
button{font-family:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:48px;height:48px;border:0;background:transparent;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#43474E;padding:0}
</style>
<style>html{background:#DADCE0}body{display:flex;justify-content:center;padding:40px 0}body>div{border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F8F9FC;color:#191C20;font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <header style="height:64px;display:flex;align-items:center;padding:0 4px;flex:none">
    <button class="ib" aria-label="Retour"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
    <h1 style="margin:0 0 0 4px;font-size:22px;font-weight:500">Convertir en PDF</h1>
  </header>

  <div style="padding:4px 16px 12px">
    <div style="display:flex;height:40px;border:1px solid #73777F;border-radius:20px;overflow:hidden">
      <button aria-pressed="true" style="flex:1;border:0;border-right:1px solid #73777F;background:#D7E3F7;color:#101C2B;font-size:14px;font-weight:500">✓ Images</button>
      <button aria-pressed="false" style="flex:1;border:0;border-right:1px solid #73777F;background:transparent;color:#191C20;font-size:14px;font-weight:500">Texte</button>
      <button aria-pressed="false" style="flex:1;border:0;background:transparent;color:#191C20;font-size:14px;font-weight:500">HTML local</button>
    </div>
  </div>

  <div style="display:flex;gap:10px;padding:4px 16px 4px;overflow:hidden">
    
      <div style="flex:none;width:72px;display:flex;flex-direction:column;gap:4px">
        <div style="position:relative;width:72px;height:96px;border-radius:8px;background:#DCE3EC;color:#43474E;display:flex;align-items:center;justify-content:center">
          <svg class="i" viewBox="0 0 24 24" role="img" aria-label="Aperçu de IMG_2041.jpg"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
          <span style="position:absolute;top:4px;left:4px;min-width:18px;height:18px;border-radius:9px;background:#2A5B8C;color:#FFFFFF;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center">1</span>
        </div>
        <span style="font-size:11px;color:#43474E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">IMG_2041.jpg</span>
      </div>
    
      <div style="flex:none;width:72px;display:flex;flex-direction:column;gap:4px">
        <div style="position:relative;width:72px;height:96px;border-radius:8px;background:#E4E0D6;color:#43474E;display:flex;align-items:center;justify-content:center">
          <svg class="i" viewBox="0 0 24 24" role="img" aria-label="Aperçu de IMG_2042.jpg"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
          <span style="position:absolute;top:4px;left:4px;min-width:18px;height:18px;border-radius:9px;background:#2A5B8C;color:#FFFFFF;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center">2</span>
        </div>
        <span style="font-size:11px;color:#43474E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">IMG_2042.jpg</span>
      </div>
    
      <div style="flex:none;width:72px;display:flex;flex-direction:column;gap:4px">
        <div style="position:relative;width:72px;height:96px;border-radius:8px;background:#D9E6DD;color:#43474E;display:flex;align-items:center;justify-content:center">
          <svg class="i" viewBox="0 0 24 24" role="img" aria-label="Aperçu de scan_ticket.png"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
          <span style="position:absolute;top:4px;left:4px;min-width:18px;height:18px;border-radius:9px;background:#2A5B8C;color:#FFFFFF;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center">3</span>
        </div>
        <span style="font-size:11px;color:#43474E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">scan_ticket.png</span>
      </div>
    
      <div style="flex:none;width:72px;display:flex;flex-direction:column;gap:4px">
        <div style="position:relative;width:72px;height:96px;border-radius:8px;background:#E6DCE3;color:#43474E;display:flex;align-items:center;justify-content:center">
          <svg class="i" viewBox="0 0 24 24" role="img" aria-label="Aperçu de plan.webp"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
          <span style="position:absolute;top:4px;left:4px;min-width:18px;height:18px;border-radius:9px;background:#2A5B8C;color:#FFFFFF;font-size:11px;font-weight:500;display:flex;align-items:center;justify-content:center">4</span>
        </div>
        <span style="font-size:11px;color:#43474E;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">plan.webp</span>
      </div>
    
    <button aria-label="Ajouter des images" style="flex:none;width:72px;height:96px;border:1px dashed #73777F;border-radius:8px;background:transparent;color:#2A5B8C;display:flex;align-items:center;justify-content:center"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>

  <div style="display:flex;flex-direction:column;gap:18px;padding:16px 24px">
    
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:14px;font-weight:500;color:#43474E">Format de page</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          
            <button aria-pressed="true" style="height:32px;padding:0 12px;border:0;border-radius:8px;background:#D7E3F7;color:#101C2B;font-size:14px;font-weight:500">A4</button>
          
            <button aria-pressed="false" style="height:32px;padding:0 12px;border:1px solid #73777F;border-radius:8px;background:transparent;color:#43474E;font-size:14px;font-weight:500">Lettre</button>
          
            <button aria-pressed="false" style="height:32px;padding:0 12px;border:1px solid #73777F;border-radius:8px;background:transparent;color:#43474E;font-size:14px;font-weight:500">Taille de l’image</button>
          
        </div>
      </div>
    
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:14px;font-weight:500;color:#43474E">Orientation</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          
            <button aria-pressed="true" style="height:32px;padding:0 12px;border:0;border-radius:8px;background:#D7E3F7;color:#101C2B;font-size:14px;font-weight:500">Auto</button>
          
            <button aria-pressed="false" style="height:32px;padding:0 12px;border:1px solid #73777F;border-radius:8px;background:transparent;color:#43474E;font-size:14px;font-weight:500">Portrait</button>
          
            <button aria-pressed="false" style="height:32px;padding:0 12px;border:1px solid #73777F;border-radius:8px;background:transparent;color:#43474E;font-size:14px;font-weight:500">Paysage</button>
          
        </div>
      </div>
    
      <div style="display:flex;flex-direction:column;gap:8px">
        <span style="font-size:14px;font-weight:500;color:#43474E">Marges</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          
            <button aria-pressed="false" style="height:32px;padding:0 12px;border:1px solid #73777F;border-radius:8px;background:transparent;color:#43474E;font-size:14px;font-weight:500">Aucune</button>
          
            <button aria-pressed="true" style="height:32px;padding:0 12px;border:0;border-radius:8px;background:#D7E3F7;color:#101C2B;font-size:14px;font-weight:500">Petites</button>
          
            <button aria-pressed="false" style="height:32px;padding:0 12px;border:1px solid #73777F;border-radius:8px;background:transparent;color:#43474E;font-size:14px;font-weight:500">Normales</button>
          
        </div>
      </div>
    
    <label style="display:flex;flex-direction:column;gap:8px">
      <span style="display:flex;justify-content:space-between;font-size:14px;font-weight:500;color:#43474E"><span>Qualité des images</span><span style="color:#191C20">85 %</span></span>
      <span style="position:relative;height:28px;display:flex;align-items:center">
        <span style="position:absolute;left:0;right:0;height:4px;border-radius:2px;background:#D3E4FF"></span>
        <span style="position:absolute;left:0;width:85%;height:4px;border-radius:2px;background:#2A5B8C"></span>
        <span style="position:absolute;left:85%;width:20px;height:20px;margin-left:-10px;border-radius:10px;background:#2A5B8C"></span>
        <input type="range" min="10" max="100" value="85" style="position:absolute;left:0;right:0;width:100%;margin:0;opacity:0">
      </span>
    </label>
    <p style="margin:0;font-size:12px;line-height:16px;color:#43474E">L’orientation des photos (EXIF) est respectée. Les très grandes images sont réduites automatiquement.</p>
  </div>

  <footer style="margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 16px 24px;border-top:1px solid #E1E2E8">
    <span style="font-size:14px;color:#43474E">4 images · 4 pages</span>
    <button style="height:48px;padding:0 24px;border:0;border-radius:24px;background:#2A5B8C;color:#FFFFFF;font-size:14px;font-weight:500">Créer le PDF</button>
  </footer>
</div>
</body>
</html>
