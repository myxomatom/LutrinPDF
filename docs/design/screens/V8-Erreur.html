<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lutrin — Erreur d'ouverture</title>
<style>
@font-face{font-family:Roboto;font-weight:400;src:url(../assets/fonts/roboto-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:500;src:url(../assets/fonts/roboto-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:Roboto;font-weight:700;src:url(../assets/fonts/roboto-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Roboto Mono";font-weight:400;src:url(../assets/fonts/roboto-mono-latin-400-normal.woff2) format("woff2")}
</style>
<style>
body{margin:0}
a{color:#2A5B8C}a:hover{color:#1C4470}
button{font-family:inherit;cursor:pointer}
.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ib{width:48px;height:48px;border:0;background:transparent;border-radius:24px;display:flex;align-items:center;justify-content:center;color:#43474E;padding:0}
</style>
<style>html{background:#DADCE0}body{display:flex;justify-content:center;padding:40px 0}body>div{border-radius:24px;box-shadow:0 8px 32px rgba(0,0,0,0.18)}</style>
</head>
<body>
<div style="width:390px;height:844px;box-sizing:border-box;background:#F8F9FC;color:#191C20;font-family:Roboto,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden">
  <header style="height:64px;display:flex;align-items:center;padding:0 4px;flex:none">
    <button class="ib" aria-label="Retour"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg></button>
    <h1 style="margin:0 0 0 4px;flex:1;min-width:0;font-size:18px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">scan_facture.pdf</h1>
  </header>

  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 40px 96px;text-align:center;gap:16px">
    <div style="width:80px;height:80px;border-radius:40px;background:#FFDAD6;color:#410002;display:flex;align-items:center;justify-content:center">
      <svg class="i" viewBox="0 0 24 24" style="width:36px;height:36px" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18v.01"></path></svg>
    </div>
    <h2 style="margin:8px 0 0;font-size:22px;font-weight:400;line-height:28px">Impossible d’ouvrir ce document</h2>
    <p style="margin:0;font-size:14px;line-height:20px;color:#43474E">Le fichier est peut-être endommagé, incomplet, ou ce n’est pas un PDF.</p>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px;align-self:stretch">
      <button style="height:48px;border:0;border-radius:24px;background:#D7E3F7;color:#101C2B;font-size:14px;font-weight:500">Retirer des récents</button>
      <button style="height:48px;border:1px solid #73777F;border-radius:24px;background:transparent;color:#2A5B8C;font-size:14px;font-weight:500">Retour à la bibliothèque</button>
    </div>
  </div>
</div>
</body>
</html>
