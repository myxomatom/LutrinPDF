# SPDX-License-Identifier: GPL-3.0-or-later
# Continuous integration (AGENTS.md §7). Every push and pull request runs:
# ktlint, detekt, Android Lint, unit / Robolectric / screenshot tests, coverage thresholds,
# dependency license allow-list, forbidden-permission check, release build, benchmark APKs
# (compiled only) and Dokka.
# MuPDF is compiled from its pinned submodule (ADR 0007): for Android with the NDK, and for
# the runner itself so that the engine is tested on the JVM.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch MuPDF and the third-party libraries it builds with
        run: ./scripts/init-mupdf.sh

      - name: Install build dependencies of the desktop MuPDF library (JVM tests)
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends libfreetype-dev libssl-dev zlib1g-dev pkg-config

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Rejects a tampered gradle-wrapper.jar.
          validate-wrappers: true

      - name: Check (lint, detekt, ktlint, tests, coverage, licenses, permissions)
        run: ./gradlew check --continue

      - name: Build release APK
        run: ./gradlew assembleRelease

      # The benchmark APKs are only compiled: macrobenchmarks never run in CI, an emulator
      # gives meaningless timings (ADR 0012). The maintainer runs them on a real device.
      - name: Build benchmark APKs (compiled, not run)
        run: ./gradlew :benchmark:assemble

      - name: Generate documentation (Dokka, warnings are errors)
        run: ./gradlew :dokkaGenerate

      - name: Build debug APKs (installable, signed with the debug key)
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One APK per ABI; most phones need arm64-v8a. Debug builds install next to the
          # published app (application id suffix .debug).
          name: lutrin-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/outputs/roborazzi/
            **/build/test-results/
          retention-days: 14

  instrumented:
    name: Instrumented tests (API 26 and latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch MuPDF and the third-party libraries it builds with
        run: ./scripts/init-mupdf.sh

      - name: Enable KVM for the emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install the Android emulator (needed by Gradle Managed Devices)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator > /dev/null

      - name: Run instrumented tests on Gradle Managed Devices
        run: >
          ./gradlew :app:ciGroupDebugAndroidTest :core:pdf:ciGroupDebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          retention-days: 14
