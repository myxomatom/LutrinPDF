# Weekly update proposals. Every new dependency version still goes through review:
# license check (docs/dependencies.md) and the CI permission / license gates.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]
    ignore:
      # compose-rules 0.5+ requires detekt 2.0, still in alpha: stay on 0.4.x with detekt 1.23 (ADR 0005).
      - dependency-name: "io.nlopez.compose.rules:detekt"
        versions: [">= 0.5.0"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # MuPDF (third-party/mupdf/libmupdf): proposals only; the pinned version in
  # gradle/libs.versions.toml must be updated with it (verifyMupdfVersion fails otherwise).
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
