# SPDX-License-Identifier: GPL-3.0-or-later
org.gradle.jvmargs=-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official
android.useAndroidX=true

# Screenshot tests compare against the reference images in src/test/screenshots on every
# test run. Record new references with ./gradlew recordRoborazziDebug (CONTRIBUTING.md).
roborazzi.test.verify=true

# Instrumented tests must also run on minSdk = 26 (AGENTS.md §7), which Gradle Managed
# Devices only accept behind this flag.
android.experimental.testOptions.managedDevices.allowOldApiLevelDevices=true
